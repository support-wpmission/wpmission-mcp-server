
name: Publish WPMission MCP to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish MCP image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/support-wpmission/wpmission-mcp-server:0.1.0
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/support-wpmission/wpmission-mcp-server
            io.modelcontextprotocol.server.name=io.github.support-wpmission/wpmission-mcp-server
          annotations: |
            io.modelcontextprotocol.server.name=io.github.support-wpmission/wpmission-mcp-server

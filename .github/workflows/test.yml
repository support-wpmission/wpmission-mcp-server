
name: Test WPMission MCP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: node --check src/index.js

      - name: Check MCP SDK imports
        run: |
          node --input-type=module -e "
            import { McpServer } from '@modelcontextprotocol/server';
            import { serveStdio } from '@modelcontextprotocol/server/stdio';
            import * as z from 'zod/v4';
            if (!McpServer || !serveStdio || !z.object) {
              throw new Error('Missing MCP dependencies');
            }
            console.log('MCP SDK imports successful');
          "

      - name: Test real MCP connection
        run: |
          npm install --no-save @modelcontextprotocol/client@^2.3.1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Client } from '@modelcontextprotocol/client';
          import { StdioClientTransport } from '@modelcontextprotocol/client/stdio';

          const client = new Client({
            name: 'wpmission-test',
            version: '0.1.0'
          });

          const transport = new StdioClientTransport({
            command: 'node',
            args: ['src/index.js']
          });

          try {
            await client.connect(transport);

            const { tools } = await client.listTools();
            assert.ok(
              tools.some(t => t.name === 'wpmission_info'),
              'WPMission tool not found'
            );

            const result = await client.callTool({
              name: 'wpmission_info',
              arguments: {}
            });

            assert.notEqual(result.isError, true);
            assert.ok(
              result.content.some(
                c => c.type === 'text' &&
                c.text.includes('WPMission')
              ),
              'Invalid tool response'
            );

            console.log('WPMission MCP test passed!');
          } finally {
            await client.close();
          }
          NODE

      - name: Verify npm package
        run: |
          npm pack --dry-run
          node --input-type=module -e "
            import fs from 'node:fs';
            const code = fs.readFileSync('src/index.js', 'utf8');
            if (!code.startsWith('#!/usr/bin/env node')) {
              throw new Error('Missing executable header');
            }
            console.log('npm package verification passed');
          "
